name: Codex References Check

on:
  pull_request:
    paths:
      - ".github/workflows/codex-references-check.yml"
      - ".codex/**"
      - "scripts/check-codex-references.mjs"
      - "scripts/sync-codex-references.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - DEV
      - main
      - PROD
    paths:
      - ".github/workflows/codex-references-check.yml"
      - ".codex/**"
      - "scripts/check-codex-references.mjs"
      - "scripts/sync-codex-references.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  check-codex-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Keep build tooling on the patched Node.js 24 security release.
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Verify .codex references are in sync
        run: npm run check:codex:references
